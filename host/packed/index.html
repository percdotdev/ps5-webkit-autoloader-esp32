  <script>
  (function () {
    var status = document.getElementById('status');
    var detail = document.getElementById('detail');
    var match = /PlayStation 5\/(\d+\.\d+)/.exec(navigator.userAgent);
    var fw = match ? parseFloat(match[1]) : 0;
    var is905 = match ? (match[1] === '9.05' || Math.abs(fw - 9.05) < 0.001) : false;

      status.textContent = 'Unsupported firmware ' + match[1];
      status.className = 'error';
      detail.textContent = 'Supported: 7.00–12.00 via Poops, 7.00–13.60 via Relapse (except 9.05).';
      return;
    }
    status.textContent = 'Preparing cache...';
    location.replace('/cache.html');

name: pages

on:
  push:
    branches: [main]
    paths:
      - flasher/**
      - .github/workflows/pages.yml
      - .github/scripts/fetch-flasher-bins.sh
  workflow_run:
    workflows: [firmware]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  pages:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check flasher scripts
        run: |
          set -euo pipefail
          find flasher -name '*.js' -not -path 'flasher/bin/*' -print0 | xargs -0 -n1 node --check

      - name: Fetch stable and pre-release bins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/fetch-flasher-bins.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flasher

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4

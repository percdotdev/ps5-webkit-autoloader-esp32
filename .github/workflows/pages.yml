name: pages

on:
  push:
    branches: [main]
    paths:
      - flasher/**
      - .github/workflows/pages.yml
      - .github/scripts/fetch-flasher-bins.sh
  workflow_run:
    workflows: [firmware]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  # Build and deploy are separate jobs, like GitHub's own Pages template: deploying in the
  # same job right after the upload can ask for the artifact before GitHub lists it.
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check flasher scripts
        run: |
          set -euo pipefail
          find flasher -name '*.js' -not -path 'flasher/bin/*' -print0 | xargs -0 -n1 node --check

      - name: Fetch stable and pre-release bins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/fetch-flasher-bins.sh

      # GitHub Pages lets browsers reuse files for 10 minutes. Stamping every local script
      # and stylesheet URL with the commit makes a new deploy load as one fresh set,
      # never old modules mixed with new ones.
      - name: Stamp asset URLs with the commit
        run: |
          set -euo pipefail
          v="${GITHUB_SHA::7}"
          find flasher -name '*.js' -not -path 'flasher/bin/*' -print0 |
            xargs -0 sed -i -E "s#(from \"\.{1,2}/[^\"?]+\.js)\"#\1?v=$v\"#g"
          sed -i -E "s#(href=\"\./[^\"?]+\.css)\"#\1?v=$v\"#g; s#(src=\"\./[^\"?]+\.js)\"#\1?v=$v\"#g" flasher/index.html
          grep -c "?v=$v" flasher/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flasher

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4

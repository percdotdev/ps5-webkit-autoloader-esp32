name: pages

on:
  push:
    branches: [main]
    paths:
      - flasher/**
      - .github/workflows/pages.yml
  workflow_run:
    workflows: [firmware]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  pages:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Fetch bins from latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p flasher/firmware
          gh release download latest \
            --repo "${{ github.repository }}" \
            --pattern '*.merged.bin' \
            --dir flasher/firmware
          ls -lh flasher/firmware

      - name: Fetch payload metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download latest \
            --repo "${{ github.repository }}" \
            --pattern 'payload.json' \
            --dir flasher || cp host/packed/version.json flasher/payload.json
          cat flasher/payload.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flasher

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4

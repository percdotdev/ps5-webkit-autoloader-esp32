name: firmware

on:
  push:
    branches: [main]
    paths:
      - firmware/**
      - host/**
      - pack/**
      - vendor/**
      - Makefile
      - install-deps.sh
      - .gitmodules
      - .github/workflows/firmware.yml
  pull_request:
    paths:
      - firmware/**
      - host/**
      - pack/**
      - vendor/**
      - Makefile
      - install-deps.sh
      - .gitmodules
      - .github/workflows/firmware.yml
  workflow_dispatch:

concurrency:
  group: firmware
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout itsPLK payload
        uses: actions/checkout@v4
        with:
          repository: itsPLK/ps5-webkit-autoloader
          path: webkit-autoloader
          submodules: recursive

      - name: Cache Arduino cores
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15-esp32-2
            ~/.arduino15/staging
            ~/.arduino15/arduino-cli-esp32-2.yaml
          key: arduino-esp32-2.0.11-8266-3.1.2

      - name: Install dependencies
        run: ./install-deps.sh

      - name: Build mklittlefs
        run: make -C vendor/mklittlefs

      - name: Record payload version
        run: |
          base=$(grep -E '#define[[:space:]]+WKAL_VERSION' webkit-autoloader/include/wkali.h | awk '{print $3}' | tr -d '"\r')
          sha=$(git -C webkit-autoloader rev-parse --short HEAD)
          echo "${base} (${sha})" | tee payload-version.txt

      - name: Pack payload
        run: bash ./pack/pack_payload.sh

      - name: Build shared image
        run: make common

      - name: Upload common
        uses: actions/upload-artifact@v4
        with:
          name: firmware-common
          path: |
            build/tls/server_certs.h
            build/dns-library
            build/common/esp32-arduino.littlefs.bin
            host/packed/version.json
            payload-version.txt

  compile:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, s2, s3, c3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Arduino cores
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15-esp32-2
            ~/.arduino15/staging
            ~/.arduino15/arduino-cli-esp32-2.yaml
          key: arduino-esp32-2.0.11-8266-3.1.2

      - name: Install compile tools
        run: COMPILE_ONLY=1 ./install-deps.sh

      - name: Build mklittlefs
        run: make -C vendor/mklittlefs

      - name: Download common
        uses: actions/download-artifact@v4
        with:
          name: firmware-common

      - name: Compile ${{ matrix.board }}
        run: make ${{ matrix.board }} REUSE_FS=1

      - name: Upload ${{ matrix.board }}
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.board }}
          path: build/${{ matrix.board }}/esp32-arduino.${{ matrix.board }}.merged.bin

  release:
    needs: [prepare, compile]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download bins
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: bins

      - name: Download payload version
        uses: actions/download-artifact@v4
        with:
          name: firmware-common
          path: common

      - name: Publish releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release
          find bins -name '*.merged.bin' -exec cp -f {} release/ \;
          find common -name version.json -exec cp -f {} release/payload.json \;
          test -f release/payload.json
          PAYLOAD="$(tr -d '[:space:]' < common/payload-version.txt 2>/dev/null || echo unknown)"
          VER="${PAYLOAD%%(*}"
          VER="${VER:-unknown}"
          TITLE="itsPLK ${PAYLOAD}"
          NOTES="itsPLK/ps5-webkit-autoloader ${PAYLOAD}. Firmware ${GITHUB_SHA::12}. Flash at 0x0. S2: esp32-arduino.s2.merged.bin."
          ls -lh release
          publish() {
            local tag="$1"
            if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release edit "$tag" --repo "${{ github.repository }}" --title "$TITLE" --notes "$NOTES"
              gh release upload "$tag" --repo "${{ github.repository }}" --clobber release/*.merged.bin release/payload.json
            else
              gh release create "$tag" \
                --repo "${{ github.repository }}" \
                --title "$TITLE" \
                --notes "$NOTES" \
                release/*.merged.bin release/payload.json
            fi
          }
          publish "$VER"
          publish latest

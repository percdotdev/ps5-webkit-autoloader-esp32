name: firmware

on:
  push:
    branches: [main]
    paths:
      - firmware/**
      - host/**
      - pack/**
      - vendor/**
      - Makefile
      - install-deps.sh
      - .gitmodules
      - .github/workflows/firmware.yml
      - .github/release-notes.md
  pull_request:
    paths:
      - firmware/**
      - host/**
      - pack/**
      - vendor/**
      - Makefile
      - install-deps.sh
      - .gitmodules
      - .github/workflows/firmware.yml
  workflow_dispatch:

# One queue per branch or PR, so a pull request build never cancels the main build.
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

# Payload channels. Each one builds every board and gets its own GitHub release.
#   stable: an itsPLK release. Publishes <version> and moves `latest`, which the web flasher installs.
#   pre:    an itsPLK pre-release. Publishes <version> marked as a pre-release and leaves `latest` alone.
# To follow upstream, change `ref` to the new itsPLK tag. When a pre-release goes
# stable, move its tag to the stable entry and delete the pre entry here and in
# the compile and release matrices.
jobs:
  prepare:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            ref: v0.7.1
            build_type: stable
          - channel: pre
            ref: v0.8.0-pre-627ba8c
            build_type: pre-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout itsPLK payload
        uses: actions/checkout@v4
        with:
          repository: itsPLK/ps5-webkit-autoloader
          ref: ${{ matrix.ref }}
          path: webkit-autoloader
          submodules: false

      - name: Cache Arduino cores
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15-esp32-2
            ~/.arduino15/staging
            ~/.arduino15/arduino-cli-esp32-2.yaml
          key: arduino-esp32-2.0.11-8266-3.1.2

      - name: Install dependencies
        run: ./install-deps.sh

      - name: Build mklittlefs
        run: make -C vendor/mklittlefs

      - name: Record payload version
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          set -euo pipefail
          # "0.7.1" for stable, "0.8.0-pre-627ba8c" for a pre-release.
          full=$(python3 webkit-autoloader/tools/gen_version.py --print)
          sha=$(git -C webkit-autoloader rev-parse --short HEAD)
          echo "${full} (${sha})" | tee payload-version.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pack payload
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          WKAL_REF: ${{ matrix.ref }}
        run: bash ./pack/pack_payload.sh

      - name: Build shared image
        run: make common

      - name: Upload common
        uses: actions/upload-artifact@v4
        with:
          name: firmware-common-${{ matrix.channel }}
          path: |
            build/tls/server_certs.h
            build/dns-library
            build/common/esp32-arduino.littlefs.bin
            payload-version.txt

  compile:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, pre]
        board: [pico, s2, s3, c3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Arduino cores
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15-esp32-2
            ~/.arduino15/staging
            ~/.arduino15/arduino-cli-esp32-2.yaml
          key: arduino-esp32-2.0.11-8266-3.1.2

      - name: Install compile tools
        run: COMPILE_ONLY=1 ./install-deps.sh

      - name: Build mklittlefs
        run: make -C vendor/mklittlefs

      - name: Download common
        uses: actions/download-artifact@v4
        with:
          name: firmware-common-${{ matrix.channel }}

      - name: Compile ${{ matrix.board }}
        run: make ${{ matrix.board }} REUSE_FS=1

      - name: Upload ${{ matrix.board }}
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.channel }}-${{ matrix.board }}
          path: build/${{ matrix.board }}/esp32-arduino.${{ matrix.board }}.merged.bin

  release:
    needs: [prepare, compile]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: [stable, pre]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bins
        uses: actions/download-artifact@v4
        with:
          pattern: bin-${{ matrix.channel }}-*
          merge-multiple: true
          path: bins

      - name: Download payload version
        uses: actions/download-artifact@v4
        with:
          name: firmware-common-${{ matrix.channel }}
          path: common

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.channel }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release
          find bins -name '*.merged.bin' -exec cp -f {} release/ \;
          (cd release && sha256sum *.merged.bin > SHA256SUMS)
          cat release/SHA256SUMS
          # payload-version.txt reads like "0.7.1 (f4fab6b)" or "0.8.0-pre-627ba8c (627ba8c)".
          PAYLOAD="$(tr -d '[:space:]' < common/payload-version.txt)"
          VER="${PAYLOAD%%(*}"
          PSHA="$(sed -n 's/.*(\(.*\)).*/\1/p' <<< "$PAYLOAD")"
          [ -n "$VER" ] && [ -n "$PSHA" ] || { echo "bad payload version: $PAYLOAD" >&2; exit 1; }
          if [ "$CHANNEL" = pre ]; then
            TITLE="itsPLK ${VER} (pre-release)"; DROP=stable; FLAGS=(--prerelease --latest=false)
          else
            TITLE="itsPLK ${VER} (${PSHA})"; DROP=pre; FLAGS=()
          fi
          # Keep the blocks for this channel, drop the other one, strip the markers.
          sed -e "/<!-- ${DROP} -->/,/<!-- \/${DROP} -->/d" -e '/^<!-- \/\?\(stable\|pre\) -->$/d' \
              -e "s|{{VER}}|${VER}|g" -e "s|{{PSHA}}|${PSHA}|g" \
              -e "s|{{SHA}}|${GITHUB_SHA}|g" -e "s|{{SHORT}}|${GITHUB_SHA::7}|g" \
              -e "s|{{REPO}}|${REPO}|g" \
              .github/release-notes.md > notes.md
          cat notes.md
          ls -lh release
          publish() {
            local tag="$1"; shift
            if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release edit "$tag" --repo "$REPO" --title "$TITLE" --notes-file notes.md "$@"
              gh release upload "$tag" --repo "$REPO" --clobber release/*.merged.bin release/SHA256SUMS
            else
              gh release create "$tag" --repo "$REPO" --title "$TITLE" --notes-file notes.md "$@" \
                release/*.merged.bin release/SHA256SUMS
            fi
          }
          publish "$VER" "${FLAGS[@]}"
          if [ "$CHANNEL" = stable ]; then
            publish latest --latest
          fi

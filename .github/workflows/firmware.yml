name: firmware

on:
  push:
    branches: [main]
    paths:
      - firmware/**
      - host/**
      - pack/**
      - vendor/**
      - Makefile
      - install-deps.sh
      - .gitmodules
      - .github/workflows/firmware.yml
      - .github/scripts/**
      - .github/release-notes.md
  pull_request:
    paths:
      - firmware/**
      - host/**
      - pack/**
      - vendor/**
      - Makefile
      - install-deps.sh
      - .gitmodules
      - .github/workflows/firmware.yml
      - .github/scripts/**
  # Follow itsPLK on its own: every 15 minutes, build whatever it published that we have not.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and republish even if nothing changed
        type: boolean
        default: false

# One queue per branch or PR. Only PR builds cancel each other; on main a
# scheduled check never cancels a release that is being built.
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Payload channels, picked by .github/scripts/resolve-payload.sh from itsPLK's releases:
#   stable: itsPLK's latest release. Publishes <version> and refreshes `latest`.
#   pre:    itsPLK's newest pre-release while it is newer than stable. Publishes
#           <version> as a pre-release and leaves `latest` alone.
# A failure never publishes anything, so users stay on the last good build.
# A pre-release that fails to build never holds back stable.
jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      prepare: ${{ steps.pick.outputs.prepare }}
      channels: ${{ steps.pick.outputs.channels }}
      fw: ${{ steps.pick.outputs.fw }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick payload versions
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force || false }}
        run: bash .github/scripts/resolve-payload.sh

  prepare:
    needs: resolve
    if: needs.resolve.outputs.channels != '[]'
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.channel == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.prepare) }}
    name: prepare (${{ matrix.channel }}, ${{ matrix.ref }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only mklittlefs is built from vendor/; the other submodule is never used.
      - name: Checkout mklittlefs
        run: git submodule update --init --recursive --depth 1 vendor/mklittlefs

      - name: Checkout itsPLK payload
        uses: actions/checkout@v4
        with:
          repository: itsPLK/ps5-webkit-autoloader
          ref: ${{ matrix.ref }}
          path: webkit-autoloader
          submodules: false

      - name: Cache Arduino cores
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15-esp32-2
            ~/.arduino15/arduino-cli-esp32-2.yaml
          key: arduino-esp32-2.0.11

      - name: Install dependencies
        run: ESP8266=0 ./install-deps.sh

      - name: Build mklittlefs
        run: make -C vendor/mklittlefs

      - name: Record payload version
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          set -euo pipefail
          # "0.7.1" for stable, "0.8.0-pre-627ba8c" for a pre-release.
          full=$(python3 webkit-autoloader/tools/gen_version.py --print)
          sha=$(git -C webkit-autoloader rev-parse HEAD | cut -c1-7)
          echo "${full} (${sha})" | tee payload-version.txt
          echo "${{ matrix.ref }}@${sha}" | tee payload-ref.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pack payload
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          WKAL_REF: ${{ matrix.ref }}
        run: bash ./pack/pack_payload.sh

      - name: Check packed payload
        run: |
          set -euo pipefail
          ver="$(sed 's/ (.*//' payload-version.txt)"
          bash ./pack/check_packed.sh "$ver" "${{ matrix.ref }}"

      - name: Upload packed payload
        if: matrix.channel == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: packed-stable
          path: host/packed

      - name: Build shared image
        run: make common

      - name: Upload common
        uses: actions/upload-artifact@v4
        with:
          name: firmware-common-${{ matrix.channel }}
          path: |
            build/tls/server_certs.h
            build/dns-library
            build/common/esp32-arduino.littlefs.bin
            payload-version.txt
            payload-ref.txt

  compile:
    needs: [resolve, prepare]
    if: needs.resolve.outputs.channels != '[]'
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.channel == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.resolve.outputs.channels) }}
        board: [pico, s2, s3, c3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only mklittlefs is built from vendor/; the other submodule is never used.
      - name: Checkout mklittlefs
        run: git submodule update --init --recursive --depth 1 vendor/mklittlefs

      - name: Cache Arduino cores
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15-esp32-2
            ~/.arduino15/arduino-cli-esp32-2.yaml
          key: arduino-esp32-2.0.11

      - name: Install compile tools
        run: COMPILE_ONLY=1 ESP8266=0 ./install-deps.sh

      - name: Build mklittlefs
        run: make -C vendor/mklittlefs

      - name: Download common
        uses: actions/download-artifact@v4
        with:
          name: firmware-common-${{ matrix.channel }}

      - name: Compile ${{ matrix.board }}
        run: make ${{ matrix.board }} REUSE_FS=1

      - name: Check image
        run: |
          set -euo pipefail
          bin=build/${{ matrix.board }}/esp32-arduino.${{ matrix.board }}.merged.bin
          size=$(stat -c %s "$bin")
          echo "$bin: $size bytes"
          # Every board here has 4 MB of flash; the merged image must fit it.
          [ "$size" -gt 1000000 ] && [ "$size" -le 4194304 ] || { echo "unexpected image size" >&2; exit 1; }

      - name: Upload ${{ matrix.board }}
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.channel }}-${{ matrix.board }}
          path: build/${{ matrix.board }}/esp32-arduino.${{ matrix.board }}.merged.bin

  release:
    needs: [resolve, compile]
    if: needs.resolve.outputs.channels != '[]' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.channel == 'pre' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: ${{ fromJSON(needs.resolve.outputs.channels) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bins
        uses: actions/download-artifact@v4
        with:
          pattern: bin-${{ matrix.channel }}-*
          merge-multiple: true
          path: bins

      - name: Download payload version
        uses: actions/download-artifact@v4
        with:
          name: firmware-common-${{ matrix.channel }}
          path: common

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.channel }}
          REPO: ${{ github.repository }}
          FW: ${{ needs.resolve.outputs.fw }}
        run: |
          set -euo pipefail
          mkdir -p release
          find bins -name '*.merged.bin' -exec cp -f {} release/ \;
          # All four boards or nothing: a release never ships with a missing image.
          for b in pico s2 s3 c3; do
            [ -s "release/esp32-arduino.$b.merged.bin" ] || { echo "missing $b image" >&2; exit 1; }
          done
          (cd release && sha256sum *.merged.bin > SHA256SUMS)
          cat release/SHA256SUMS
          # payload-version.txt reads like "0.7.1 (f4fab6b)" or "0.8.0-pre-627ba8c (627ba8c)".
          PAYLOAD="$(tr -d '[:space:]' < common/payload-version.txt)"
          VER="${PAYLOAD%%(*}"
          PSHA="$(sed -n 's/.*(\(.*\)).*/\1/p' <<< "$PAYLOAD")"
          REF="$(tr -d '[:space:]' < common/payload-ref.txt)"
          REF_TAG="${REF%@*}"
          [ -n "$VER" ] && [ -n "$PSHA" ] && [ -n "$REF_TAG" ] || { echo "bad payload version: $PAYLOAD $REF" >&2; exit 1; }
          if [ "$CHANNEL" = pre ]; then
            TITLE="itsPLK ${VER} (pre-release)"; DROP=stable; FLAGS=(--prerelease --latest=false)
          else
            TITLE="itsPLK ${VER} (${PSHA})"; DROP=pre; FLAGS=(--latest)
          fi
          # Keep the blocks for this channel, drop the other one, strip the markers.
          sed -e "/<!-- ${DROP} -->/,/<!-- \/${DROP} -->/d" -e '/^<!-- \/\?\(stable\|pre\) -->$/d' \
              -e "s|{{VER}}|${VER}|g" -e "s|{{PSHA}}|${PSHA}|g" \
              -e "s|{{REF}}|${REF_TAG}|g" -e "s|{{PSHA7}}|${REF#*@}|g" -e "s|{{FW}}|${FW}|g" \
              -e "s|{{SHA}}|${GITHUB_SHA}|g" -e "s|{{SHORT}}|${GITHUB_SHA::7}|g" \
              -e "s|{{REPO}}|${REPO}|g" \
              .github/release-notes.md > notes.md
          cat notes.md
          ls -lh release
          publish() {
            local tag="$1"; shift
            if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release edit "$tag" --repo "$REPO" --title "$TITLE" --notes-file notes.md "$@"
              gh release upload "$tag" --repo "$REPO" --clobber release/*.merged.bin release/SHA256SUMS
            else
              gh release create "$tag" --repo "$REPO" --title "$TITLE" --notes-file notes.md "$@" \
                release/*.merged.bin release/SHA256SUMS
            fi
          }
          new=true
          gh release view "$VER" --repo "$REPO" >/dev/null 2>&1 && new=false
          publish "$VER" "${FLAGS[@]}"
          # `latest` is a stable download link; GitHub's own "Latest" badge stays on <version>.
          if [ "$CHANNEL" = stable ]; then
            publish latest --latest=false
          fi
          # Only the newest pre-release stays up. A new pre-release replaces the older
          # ones; a new stable version replaces them all.
          if [ "$CHANNEL" = pre ] || [ "$new" = true ]; then
            gh api "repos/$REPO/releases?per_page=100" --jq '.[] | select(.prerelease) | .tag_name' |
              while read -r old; do
                [ "$old" = "$VER" ] && continue
                echo "removing superseded pre-release $old"
                gh release delete "$old" --repo "$REPO" --yes --cleanup-tag
              done
          fi

  # Keeps host/packed in the repo on the stable payload, so the source matches the
  # Latest release. Pushes made with GITHUB_TOKEN start no workflows, so no loop.
  sync:
    needs: [resolve, release]
    if: contains(needs.resolve.outputs.channels, 'stable') && needs.release.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download packed payload
        uses: actions/download-artifact@v4
        with:
          name: packed-stable
          path: packed-new

      - name: Commit host/packed
        run: |
          set -euo pipefail
          old=$(cat host/packed/app/*/__complete__ 2>/dev/null || true)
          new=$(cat packed-new/app/*/__complete__)
          # Same version means only build timestamps changed: not worth a commit.
          if [ "$old" = "$new" ]; then echo "host/packed already on $new"; exit 0; fi
          rm -rf host/packed && mv packed-new host/packed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A host/packed
          git commit -m "chore: serve itsPLK $new"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

  report:
    needs: [resolve, prepare, compile, release, sync]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open or close the build-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILT: ${{ needs.resolve.outputs.channels }}
        run: bash .github/scripts/report-build.sh

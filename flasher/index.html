<!DOCTYPE html>
<html lang="en">
<head>

  <meta property="og:url" content="https://percdotdev.github.io/ps5-webkit-autoloader-esp32/">
  <meta property="og:image" content="https://percdotdev.github.io/ps5-webkit-autoloader-esp32/share/og.png?v=2">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='6' fill='%23111114'/%3E%3Cpath d='M8 8.5h5.5a2.5 2.5 0 0 1 0 5H10V16' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
  <script>
    try {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <link rel="stylesheet" href="./app/base.css">
  <link rel="stylesheet" href="./app/layout.css">
  <link rel="stylesheet" href="./ui/controls.css">
  <link rel="stylesheet" href="./boards/boards.css">
  <link rel="stylesheet" href="./wizard/wizard.css">
  <link rel="stylesheet" href="./advanced/advanced.css">
  <link rel="stylesheet" href="./firmware/firmware.css">
  <link rel="stylesheet" href="./log/log.css">
</head>
<body>
  <a class="skip" href="#main" id="skip">Skip to content</a>

  <header class="top">
    <a class="brand" href="./">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6"/><path d="M8 8.5h5.5a2.5 2.5 0 0 1 0 5H10V16"/></svg>
      <span>WebKit Autoloader</span>
    </a>
    <div class="top-tools">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-set-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-set-lang="es" aria-pressed="false">ES</button>
      </div>
      <button type="button" class="icon-btn" id="theme" aria-label="Toggle theme"></button>
      <a class="gh" id="gh" href="https://github.com/percdotdev/ps5-webkit-autoloader-esp32" aria-label="GitHub"><span class="gh-ic" id="gh-ic"></span></a>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="wiz" id="wiz" aria-live="polite">
      <div class="art-box" id="art"></div>
      <ol class="leds" id="leds"></ol>
      <h1 class="wiz-title" id="wiz-title"></h1>
      <p class="wiz-body" id="wiz-body"></p>
      <div class="meter" id="meter" role="progressbar" aria-labelledby="phase" hidden>
        <i class="meter-fill" id="bar"></i>
        <span class="meter-tx" id="phase"></span><span class="meter-pct" id="pct"></span>
      </div>
      <div class="wiz-actions" id="wiz-actions"></div>
      <div class="wiz-extra" id="wiz-extra" hidden></div>
    </section>
  </main>

  <footer class="foot">
    <span id="foot-note"></span>
    <nav>
      <button type="button" class="foot-btn" id="open-adv"></button>
      <a id="foot-src" href="https://github.com/percdotdev/ps5-webkit-autoloader-esp32"></a>
      <a href="https://github.com/itsPLK/ps5-webkit-autoloader">itsPLK</a>
    </nav>
  </footer>

  <dialog class="sheet" id="adv" aria-labelledby="adv-title">
    <div class="sheet-head">
      <h2 id="adv-title"></h2>
      <button type="button" class="icon-btn" id="close-adv"></button>
    </div>
    <div class="sheet-body">
      <section class="adv-group" aria-labelledby="ver-title">
        <h3 id="ver-title"></h3>
        <div id="channel" class="channel" hidden></div>
        <div id="release" class="release"></div>
      </section>
      <section class="adv-group" aria-labelledby="board-title">
        <h3 id="board-title"></h3>
        <p class="adv-note" id="board-hint"></p>
        <div id="boards" class="boards" role="radiogroup" aria-labelledby="board-title"></div>
      </section>
      <section class="adv-group" aria-labelledby="write-title">
        <h3 id="write-title"></h3>
        <label class="check">
          <input type="checkbox" id="erase">
          <span><b id="erase-label"></b><small id="erase-hint"></small></span>
        </label>
        <label class="drop" id="drop">
          <input type="file" id="file" accept=".bin,application/octet-stream">
          <span class="drop-ic" id="drop-icon" aria-hidden="true"></span>
          <span class="drop-tx"><b id="drop-title"></b><small id="drop-hint"></small></span>
          <button type="button" class="btn ghost sm" id="file-clear" hidden></button>
        </label>
      </section>
      <section class="adv-group" aria-labelledby="logs-title">
        <div class="adv-row"><h3 id="logs-title"></h3><button type="button" class="btn ghost sm" id="copy-log"></button></div>
        <div class="log" id="log" role="log"></div>
      </section>
    </div>
  </dialog>

  <script type="module" src="./app/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f1ec">
  <title>PS5 WebKit Autoloader</title>
  <meta name="description" content="Write the PS5 WebKit Autoloader firmware to an ESP32, then join ESP32_PORTAL on the console and open the User’s Guide.">
  <link rel="canonical" href="https://percdotdev.github.io/ps5-webkit-autoloader-esp32/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="PS5 WebKit Autoloader">
  <meta property="og:title" content="PS5 WebKit Autoloader">
  <meta property="og:description" content="Write the PS5 WebKit Autoloader firmware to an ESP32, then join ESP32_PORTAL on the console and open the User’s Guide.">
  <meta property="og:url" content="https://percdotdev.github.io/ps5-webkit-autoloader-esp32/">
  <meta property="og:image" content="https://percdotdev.github.io/ps5-webkit-autoloader-esp32/share/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="PS5 WebKit Autoloader for ESP32: flash, join ESP32_PORTAL, open User’s Guide.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PS5 WebKit Autoloader">
  <meta name="twitter:description" content="Write the PS5 WebKit Autoloader firmware to an ESP32, then join ESP32_PORTAL on the console and open the User’s Guide.">
  <meta name="twitter:image" content="https://percdotdev.github.io/ps5-webkit-autoloader-esp32/share/og.png">
  <meta name="twitter:image:alt" content="PS5 WebKit Autoloader for ESP32: flash, join ESP32_PORTAL, open User’s Guide.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' fill='%23221e1b'/%3E%3Crect x='7' y='7' width='10' height='10' fill='%23b4542b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Onest:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
  <script>
    (() => {
      let t = null;
      try { t = localStorage.getItem("theme"); } catch {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="./app/page.css">
</head>
<body>
  <a class="skip" href="#main" id="skip">Skip to content</a>

  <header class="bar">
    <div class="bar-in">
      <a class="wordmark" href="./">WebKit Autoloader</a>
      <p class="status" id="pill" role="status" aria-live="polite"><span id="pill-text">Not connected</span></p>
      <div class="bar-tools">
        <div class="seg" role="group" aria-label="Language">
          <button type="button" data-set-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-set-lang="es" aria-pressed="false">ES</button>
        </div>
        <button type="button" class="icon-btn" id="theme" aria-label="Toggle theme"></button>
        <a class="icon-btn" id="gh" href="https://github.com/percdotdev/ps5-webkit-autoloader-esp32" aria-label="GitHub"></a>
      </div>
    </div>
  </header>

  <main id="main" class="page" tabindex="-1">
    <div class="intro">
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
    </div>

    <ol class="steps">
      <li class="step">
        <div class="step-head"><span class="step-n" aria-hidden="true">1</span><h2 id="fw-title"></h2></div>
        <div class="step-body">
          <div id="boards" class="boards" role="radiogroup" aria-labelledby="fw-title"></div>
        </div>
      </li>

      <li class="step">
        <div class="step-head"><span class="step-n" aria-hidden="true">2</span><h2 id="install-title"></h2></div>
        <div class="step-body">
          <div class="desk plate">
            <section class="device" id="device" aria-labelledby="dev-title"></section>
            <section class="install" aria-labelledby="install-title">
              <dl class="release" id="release"></dl>
              <label class="check">
                <input type="checkbox" id="erase">
                <span><b id="erase-label"></b><small id="erase-hint"></small></span>
              </label>
              <button type="button" class="btn" id="install"></button>
              <div class="meter" id="meter" hidden>
                <div class="meter-row"><span id="phase"></span><span id="pct" class="num">0%</span></div>
                <div class="bar-track"><i id="bar"></i></div>
              </div>
            </section>
          </div>

          <label class="drop" id="drop">
            <input type="file" id="file" accept=".bin,application/octet-stream">
            <span class="drop-ic" id="drop-icon" aria-hidden="true"></span>
            <span class="drop-tx"><span id="or-file" class="drop-kicker"></span><b id="drop-title"></b><small id="drop-hint"></small></span>
            <button type="button" class="btn btn--quiet btn--sm" id="file-clear" hidden></button>
          </label>

          <details class="fold" id="logs-box">
            <summary><span id="logs-title"></span>
              <button type="button" class="btn btn--quiet btn--sm" id="copy-log"></button></summary>
            <div class="log" id="log" role="log" aria-live="polite"></div>
          </details>
        </div>
      </li>

      <li class="step" id="guide-box">
        <div class="step-head"><span class="step-n" aria-hidden="true">3</span><h2 id="guide-title"></h2></div>
        <div class="step-body guide" id="guide"></div>
      </li>
    </ol>
  </main>

  <footer class="foot">
    <p id="foot-note"></p>
    <p id="foot-photos"></p>
    <nav aria-label="Project">
      <a id="foot-src" href="https://github.com/percdotdev/ps5-webkit-autoloader-esp32"></a>
      <a id="foot-rel" href="https://github.com/percdotdev/ps5-webkit-autoloader-esp32/releases/latest"></a>
      <a href="https://github.com/itsPLK/ps5-webkit-autoloader">itsPLK</a>
    </nav>
  </footer>

  <script type="module" src="./app/main.js"></script>
</body>
</html>

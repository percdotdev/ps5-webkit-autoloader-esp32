<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG</title>
  <meta name="robots" content="noindex">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #171717; }
    body {
      box-sizing: border-box;
      color: #f2f2f2;
      font: 22px/1.4 ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
      padding: 72px 80px 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .kicker { color: #8d8d8d; font-size: 16px; letter-spacing: 0.14em; }
    h1 { margin: 14px 0 0; font-size: 52px; font-weight: 600; letter-spacing: -0.03em; }
    .sub { color: #8d8d8d; margin: 18px 0 0; font-size: 22px; }
    .sub b { color: #f2f2f2; font-weight: 600; }
    .track { display: flex; align-items: center; margin-top: 52px; width: 520px; }
    .tick {
      width: 36px; height: 36px; border: 1px solid #f2f2f2; flex: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-variant-numeric: tabular-nums;
    }
    .tick.on { background: #f2f2f2; color: #171717; }
    .rail { flex: 1; height: 1px; background: #2c2c2c; min-width: 12px; }
    footer { color: #8d8d8d; font-size: 16px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div>
    <div class="kicker">ESP32</div>
    <h1>PS5 WebKit Autoloader</h1>
    <p class="sub">Flash · Join <b>ESP32_PORTAL</b> · Open User’s Guide</p>
    <div class="track" aria-hidden="true">
      <div class="tick on">1</div><div class="rail"></div>
      <div class="tick">2</div><div class="rail"></div>
      <div class="tick">3</div><div class="rail"></div>
      <div class="tick">4</div><div class="rail"></div>
      <div class="tick">5</div><div class="rail"></div>
      <div class="tick">6</div><div class="rail"></div>
      <div class="tick">7</div>
    </div>
  </div>
  <footer>
    <span>EN · ES</span>
    <span>percdotdev.github.io</span>
  </footer>
</body>
</html>

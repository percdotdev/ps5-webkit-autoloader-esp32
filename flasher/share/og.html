<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebKit Autoloader card</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap">
  <style>
    /* Source for og.png, rendered at 1200 x 630. Previews show it around 500px wide and
       X crops it to 2:1, so text is large and nothing sits within 48px of an edge. */
    :root { --bg: #141415; --fg: #ededed; --dim: #a1a1a6; --accent: #e39a62; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--fg); }
    body {
      box-sizing: border-box; padding: 64px 72px; font-family: Geist, system-ui, sans-serif;
      display: grid; grid-template-columns: 500px 1fr; align-items: center; gap: 40px;
    }
    h1 { margin: 0; font-size: 72px; line-height: 1; font-weight: 500; letter-spacing: -0.035em; }
    h1 span { color: var(--accent); }
    p { margin: 28px 0 0; font-size: 30px; line-height: 1.3; color: var(--dim); max-width: 15em; }
    .url { margin-top: 36px; font: 400 22px/1 "Geist Mono", monospace; color: var(--dim); }
    .boards { height: 470px; display: flex; align-items: flex-end; justify-content: flex-end; gap: 20px; }
    .boards > div { display: flex; align-items: flex-end; }
    .boards svg { display: block; width: 100%; height: auto; }
    .b-s2 { width: 138px; } .b-c3 { width: 100px; } .b-s3 { width: 108px; } .b-pico { width: 92px; }
  </style>
</head>
<body>
  <div>
    <h1>WebKit Autoloader<br><span>for ESP32</span></h1>
    <p>Flash your board from Chrome in three steps</p>
    <div class="url">percdotdev.github.io</div>
  </div>
  <div class="boards" id="boards"></div>
  <script type="module">
    import { boardThumb } from "../boards/art.js";
    document.getElementById("boards").innerHTML = ["s2", "c3", "s3", "pico"]
      .map((id) => `<div class="b-${id}">${boardThumb(id)}</div>`).join("");
  </script>
</body>
</html>
